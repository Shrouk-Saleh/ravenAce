<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raven ACE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <style>
    /* ── Light theme (default) ───────────────────────────────── */
    :root {
      --color-primary: #004ac6;
      --color-on-primary: #ffffff;
      --color-primary-container: #204eb1;
      --color-on-primary-container: #eeefff;
      --color-secondary: #0a9396;
      --color-secondary-container: #6063ee;
      --color-on-secondary-container: #fffbff;
      --color-background: #f8f9ff;
      --color-surface: #f8f9ff;
      --color-surface-container-lowest: #ffffff;
      --color-surface-container-low: #eff4ff;
      --color-surface-container: #e5eeff;
      --color-surface-container-high: #dce9ff;
      --color-surface-container-highest: #d3e4fe;
      --color-on-surface: #0b1c30;
      --color-on-surface-variant: #434655;
      --color-outline: #737686;
      --color-outline-variant: #c3c6d7;
      --color-error: #ba1a1a;
      --color-error-container: #ffdad6;
      --color-on-error-container: #93000a;
      --color-tertiary-container: #bc4800;
      --color-on-tertiary-container: #ffede6;
    }

    /* ── Dark theme — toggled via .dark class on <html> ─────────
         Mapping follows Material You dark-theme conventions: surfaces
         get darker as they go from background, containers use the
         strong brand color but on-* text stays light for contrast. */
    html.dark {
      --color-primary: #aec6ff;
      --color-on-primary: #002e6d;
      --color-primary-container: #204eb1;
      --color-on-primary-container: #eeefff;
      --color-secondary: #c2c1ff;
      --color-secondary-container: #0a9396;
      --color-on-secondary-container: #fffbff;
      --color-background: #10131c;
      --color-surface: #10131c;
      --color-surface-container-lowest: #0a0d15;
      --color-surface-container-low: #181c28;
      --color-surface-container: #1d2230;
      --color-surface-container-high: #282e3e;
      --color-surface-container-highest: #333a4c;
      --color-on-surface: #e2e2e9;
      --color-on-surface-variant: #c3c6d7;
      --color-outline: #8d909f;
      --color-outline-variant: #434655;
      --color-error: #ffb4ab;
      --color-error-container: #93000a;
      --color-on-error-container: #ffdad6;
      --color-tertiary-container: #ffb787;
      --color-on-tertiary-container: #4a2800;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .input-halo:focus {
      box-shadow: 0 0 0 2px #dbe1ff;
    }

    html.dark .input-halo:focus {
      box-shadow: 0 0 0 2px #2563eb55;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="bg-background text-on-surface min-h-screen transition-colors duration-200">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
